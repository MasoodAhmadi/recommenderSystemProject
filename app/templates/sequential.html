<!DOCTYPE html>
<html>

<head>
    <title>Sequential Group Recommendations</title>
</head>

<body>
    <h1>Sequential Group Recommendations</h1>
    <ul>
        {% if recommendations %}
        {% for item_id, title, score in recommendations %}
        <li>Movie ID: {{ item_id }}, Title: {{ title }}, Score: {{ score }}</li>
        {% endfor %}
        {% else %}
        <li>No recommendations available.</li>
        {% endif %}
    </ul>

</body>

</html>
