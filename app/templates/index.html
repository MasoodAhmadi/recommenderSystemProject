<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Navigation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 40px;
            text-align: center;
        }

        .button-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 25px 50px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background-color: #007BFF;
            color: white;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            min-width: 200px;
            flex: 1 1 auto;
        }

        button:hover {
            background-color: #0056b3;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .button-row {
                flex-direction: column;
                gap: 20px;
            }

            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <h1>DATA.ML.360-2025-2026-1 Recommender Systems</h1>
    <div class="button-row">
        <button onclick="window.location.href='{{ url_for('main.part1') }}'">Part 1</button>
        <button onclick="window.location.href='{{ url_for('main.part2') }}'">Part 2</button>
        <button onclick="window.location.href='{{ url_for('main.part3') }}'">Part 3</button>
        <button onclick="window.location.href='{{ url_for('main.part4') }}'">Part 4</button>
    </div>
</body>

</html>
